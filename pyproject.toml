[project]
name = "contractor-lookup"
version = "0.1.0"
description = "A website for looking up contractor licensing"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.110.0",
  "lxml>=5.0.0",
  "openpyxl>=3.1.0",
  "pre-commit>=3.7.0",
  "pdfplumber>=0.11.0",
  "playwright>=1.40.0",
  "pymysql>=1.1.0",
  "pyright>=1.1.350",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "requests>=2.28.0",
  "ruff>=0.6.0",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.28.0",
]

[project.urls]
# Homepage = "<TBD>"
# Documentation = "<TBD>"
Repository = "https://github.com/hshaner555/contractor-lookup.git"
Issues = "https://github.com/hshaner555/contractor-lookup/issues"
Changelog = "https://github.com/hshaner555/contractor-lookup/blob/main/CHANGELOG.md"

# Declares this directory as a workspace and points to members
[tool.uv.workspace]
#members = ["lib/*", "api/*", "importers/pyproject.toml"]
members = ["lib/", "api/", "importers/"]

[tool.black]
line-length = 120
target-version = ['py312']
extend-exclude = '''
(
  # A regex preceded by a tilde matches files that are ignored except if they are
  # explicitly passed to Black.
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["api/src", "importers/src", "importers/*.py", "lib/src", "tests"]
exclude = ["**/__pycache__", ".venv"]
extraPaths = ["api/src", "importers/src", "importers", "lib/src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests", "importers/tests", "lib/tests"]
pythonpath = ["api/src", "importers/src", "lib/src"]
addopts = "-ra"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true
