services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: contractors
      POSTGRES_USER: contractor
      POSTGRES_PASSWORD: contractor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractor -d contractors"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://contractor:contractor@db:5432/contractors
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  importers:
    build:
      context: .
      dockerfile: importers/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://contractor:contractor@db:5432/contractors
    depends_on:
      db:
        condition: service_healthy
    profiles: ["importers"]
    volumes:
      - ./importers:/data/importers:ro
    command: ["contractor-import-csv", "/data/importers/sample_import.csv"]

volumes:
  postgres-data:
