services:
  - type: web
    name: contractor-api
    runtime: python
    buildCommand: pip install uv && uv sync
    startCommand: uv run --package api python scripts/init_database.py && uv run --package api uvicorn contractor_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contractor-db
          property: connectionString

databases:
  - name: contractor-db
    databaseName: contractor_prod
    user: contractor_admin
    plan: free
